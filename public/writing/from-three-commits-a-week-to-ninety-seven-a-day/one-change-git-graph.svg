<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Git graph of one agent change from issue to production" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><title>Git graph of one agent change from issue to production</title><rect x="0" y="0" width="900" height="430" rx="14" fill="#141a26"/><text x="30" y="30" font-size="15" fill="#c9ccd1" text-anchor="start" font-weight="bold">One change, end to end (the shape of most of those commits)</text><text x="30" y="50" font-size="12" fill="#9aa0a8" text-anchor="start" font-weight="normal">Agents commit; a reviewer gates; nothing reaches main without a clean review. I see it only if it gets stuck.</text><text x="30" y="114" font-size="12" fill="#c9ccd1" text-anchor="start" font-weight="bold">main</text><text x="30" y="224" font-size="12" fill="#2fa39a" text-anchor="start" font-weight="bold">agent branch</text><text x="30" y="334" font-size="12" fill="#d4a72c" text-anchor="start" font-weight="bold">review</text><line x1="150" x2="870" y1="110" y2="110" stroke="#c9ccd1" stroke-width="3"/><path d="M 200 110 C 230 110, 230 220, 260 220 L 690 220 C 705 220, 705 110, 720 110" fill="none" stroke="#2fa39a" stroke-width="3"/><path d="M 450 220 C 470 220, 470 330, 490 330 L 540 330 C 560 330, 560 220, 580 220" fill="none" stroke="#d4a72c" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="200" cy="110" r="8" fill="#14161c" stroke="#c9ccd1" stroke-width="3"/><text x="200" y="92" font-size="11.5" fill="#c9ccd1" text-anchor="middle" font-weight="normal">issue filed</text><text x="200" y="78" font-size="10.5" fill="#9aa0a8" text-anchor="middle" font-weight="normal">by an agent or me</text><circle cx="290" cy="220" r="8" fill="#14161c" stroke="#2fa39a" stroke-width="3"/><text x="290" y="246" font-size="11.5" fill="#c9ccd1" text-anchor="middle" font-weight="normal">fix</text><text x="290" y="260" font-size="10.5" fill="#9aa0a8" text-anchor="middle" font-weight="normal">tests first</text><circle cx="350" cy="220" r="8" fill="#14161c" stroke="#2fa39a" stroke-width="3"/><text x="350" y="246" font-size="11.5" fill="#c9ccd1" text-anchor="middle" font-weight="normal">fix</text><circle cx="410" cy="220" r="8" fill="#14161c" stroke="#2fa39a" stroke-width="3"/><text x="410" y="246" font-size="11.5" fill="#c9ccd1" text-anchor="middle" font-weight="normal">docs</text><circle cx="515" cy="330" r="8" fill="#14161c" stroke="#d4a72c" stroke-width="3"/><text x="515" y="356" font-size="11.5" fill="#c9ccd1" text-anchor="middle" font-weight="normal">review: 1 medium</text><text x="515" y="370" font-size="10.5" fill="#9aa0a8" text-anchor="middle" font-weight="normal">findings by severity</text><circle cx="600" cy="220" r="8" fill="#14161c" stroke="#2fa39a" stroke-width="3"/><text x="600" y="246" font-size="11.5" fill="#c9ccd1" text-anchor="middle" font-weight="normal">fix round 1</text><circle cx="660" cy="220" r="8" fill="#14161c" stroke="#2fa39a" stroke-width="3"/><text x="660" y="202" font-size="11.5" fill="#c9ccd1" text-anchor="middle" font-weight="normal">re-review: clean</text><circle cx="720" cy="110" r="8" fill="#14161c" stroke="#c9ccd1" stroke-width="3"/><text x="720" y="92" font-size="11.5" fill="#c9ccd1" text-anchor="middle" font-weight="normal">merge</text><text x="720" y="78" font-size="10.5" fill="#9aa0a8" text-anchor="middle" font-weight="normal">squash</text><circle cx="825" cy="110" r="8" fill="#14161c" stroke="#c9ccd1" stroke-width="3"/><text x="825" y="92" font-size="11.5" fill="#c9ccd1" text-anchor="middle" font-weight="normal">deploy + verify</text><text x="825" y="78" font-size="10.5" fill="#9aa0a8" text-anchor="middle" font-weight="normal">live check</text><text x="450" y="390" font-size="12" fill="#9aa0a8" text-anchor="middle" font-weight="normal">≤ 3 fix rounds, then it comes to me. Leftover nits go to a backlog issue, not a new loop.</text><text x="450" y="410" font-size="12" fill="#9aa0a8" text-anchor="middle" font-weight="normal">Every commit is tagged me / agent / automation, because the agents commit as my GitHub account.</text></svg>
